<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <title>F1 — Ultimate Cinema Edition</title>
    <meta
      name="description"
      content="An original, cinematic motorsport web experience: a photoreal procedural open-wheel car, a playable browser racing simulation, a telemetry command centre and a circuit atlas. Unofficial fan project."
    />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="preload" as="style" href="/assets/fonts/fonts.css" />
    <link rel="icon" href="/assets/icons/f1.svg" type="image/svg+xml" />
    <script>
      // Set the theme class before first paint so there is no flash of the wrong shell.
      try {
        document.documentElement.dataset.js = 'on';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 32px; font-family: system-ui, sans-serif; color: #f4f6f8; background: #050506">
        <h1>F1</h1>
        <p>
          This experience renders the interactive 3D garage, telemetry and race simulation with JavaScript. The page
          still loads its photography and written content, but the interactive layer needs JavaScript enabled.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
